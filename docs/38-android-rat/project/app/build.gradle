plugins {
    id 'com.android.application'
}

android {
    namespace 'com.company.auditagent'
    compileSdk 34

    defaultConfig {
        applicationId "com.company.auditagent"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // C2 config is loaded from assets/config.json at runtime (XOR-encoded)
        // — no plaintext strings baked into BuildConfig
    }

    buildFeatures { buildConfig false }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
