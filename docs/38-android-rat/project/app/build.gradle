plugins {
    id 'com.android.application'
}

android {
    namespace 'com.company.auditagent'
    compileSdk 34

    defaultConfig {
        applicationId "com.company.auditagent"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // ── C2 config — change before building ───────────────────────────────
        buildConfigField "String",  "C2_HOST",    '"https://192.168.1.100:4444"'
        buildConfigField "String",  "C2_AUTH",    '"changeme"'
        buildConfigField "boolean", "TRUST_ALL",  "true"   // set false when using real cert
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
