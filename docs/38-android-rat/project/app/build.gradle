plugins {
    id 'com.android.application'
}

android {
    namespace 'com.company.rat'
    compileSdk 34

    defaultConfig {
        applicationId "com.corp.enterprise.sync"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "3.1.2"
    }

    buildFeatures { buildConfig false }

    signingConfigs {
        release {
            storeFile     file('keystore/release.jks')
            storePassword 'Android2024!'
            keyAlias      'release'
            keyPassword   'Android2024!'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig   signingConfigs.release
            minifyEnabled   true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.all {
    resolutionStrategy {
        // appcompat 1.6 pulls kotlin-stdlib-jdk7/jdk8 1.6.0 which conflicts with
        // kotlin-stdlib 1.8.22 (jdk7+jdk8 are merged in 1.8+). Force a single version.
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
