title: Suspicious PowerShell or CMD Execution via ShellExecute
id: 0a3d6e9b-f5c7-8f1a-2b4c-7d8e9f0a1b2c
status: experimental
description: >
  Detects PowerShell or cmd.exe spawned with suspicious flags commonly used by
  malware: encoded commands, hidden window, no-profile, bypass execution policy,
  or piped download-cradles. Also covers cmd.exe launched with /c and a shell
  command that was passed via a non-interactive parent (RAT shell execution).
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1059/003/
author: B4B3-RAT Red Team
date: 2026/09/29
tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1059.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_powershell_encoded:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
      - '-e '
      - 'IEX '
      - 'Invoke-Expression'
      - 'DownloadString'
      - 'DownloadFile'
      - 'WebClient'
      - '-WindowStyle Hidden'
      - '-NonInteractive'
      - '-ExecutionPolicy Bypass'
      - '-NoProfile'
  selection_cmd_silent:
    Image|endswith: '\cmd.exe'
    CommandLine|contains:
      - '/c '
    ParentImage|endswith:
      - '\explorer.exe'    # unusual — real shell sessions don't parent to explorer
    CommandLine|contains|any:
      - 'ping '
      - 'tasklist'
      - 'whoami'
      - 'net user'
      - 'ipconfig'
      - 'systeminfo'
  condition: selection_powershell_encoded or selection_cmd_silent
falsepositives:
  - Administrative scripts using encoded commands for legitimate purposes
  - IT management tools that run diagnostics via cmd
level: medium
