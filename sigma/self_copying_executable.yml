title: Self-Copying Executable to Persistence Location
id: 6a9d2e5b-f1c3-4f7a-8b0c-3d4e5f6a7b8c
status: experimental
description: >
  Detects a process copying its own image to a user-writable or system persistence
  path before spawning the copy. This is characteristic of RAT/dropper first-run
  installation: the original executable copies itself to a persistent location
  (AppData, ProgramData, or a configured drop path) and then re-executes from there.
  Detected by: file creation in persistence paths where the creating process image
  path matches a different (source) location.
references:
  - https://attack.mitre.org/techniques/T1036/
  - https://attack.mitre.org/techniques/T1547/001/
author: B4B3-RAT Red Team
date: 2026/09/29
tags:
  - attack.defense_evasion
  - attack.persistence
  - attack.t1036
  - attack.t1547
logsource:
  product: windows
  category: file_event
detection:
  selection_drop_to_appdata:
    TargetFilename|contains:
      - '\AppData\Roaming\'
      - '\AppData\Local\'
      - '\ProgramData\'
      - '\Users\Public\'
    TargetFilename|endswith:
      - '.exe'
  filter_known_installers:
    Image|contains:
      - '\Windows\System32\'
      - '\Windows\SysWOW64\'
      - '\Program Files\'
      - '\Program Files (x86)\'
      - 'setup'
      - 'install'
      - 'update'
  condition: selection_drop_to_appdata and not filter_known_installers
falsepositives:
  - Portable application launchers that extract/copy to AppData on first run
  - Electron and other runtime-bundled applications
level: medium
---
title: Process Spawned from Newly Written Executable in AppData
id: 7b0e3f6c-a2d4-5a8b-9c1d-4e5f6a7b8c9d
status: experimental
description: >
  Detects execution of a newly created executable from AppData or ProgramData.
  Combined with a preceding file creation event, this strongly indicates a
  self-copying or dropper pattern: write then execute from the drop location.
references:
  - https://attack.mitre.org/techniques/T1204/002/
author: B4B3-RAT Red Team
date: 2026/09/29
tags:
  - attack.execution
  - attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|contains:
      - '\AppData\Roaming\'
      - '\AppData\Local\'
      - '\ProgramData\'
      - '\Users\Public\'
  filter_known_apps:
    Image|contains:
      - '\Microsoft\Teams\'
      - '\Microsoft\Edge\'
      - '\Google\Chrome\'
      - '\Spotify\Spotify.exe'
      - '\Discord\'
      - '\Slack\'
  condition: selection and not filter_known_apps
falsepositives:
  - Many legitimate applications (Spotify, Discord, etc.) run from AppData
  - Add known application paths to filter_known_apps for your environment
level: low
