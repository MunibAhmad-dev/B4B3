title: Unusual Windows Service Created from User-Writable Path
id: 2b5f8e3d-a1c9-4b7e-8d0a-5e6f7a8b9c0d
status: experimental
description: >
  Detects Windows service creation where the binary path points to user-writable
  locations. Malware frequently registers itself as a service for persistence.
  Legitimate services are almost always installed under %SystemRoot% or %ProgramFiles%.
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: B4B3-RAT Red Team
date: 2026/09/29
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1543.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_sc:
    Image|endswith: '\sc.exe'
    CommandLine|contains: 'create'
  selection_suspicious_binpath:
    CommandLine|contains:
      - 'binPath='
  filter_legit:
    CommandLine|contains:
      - '\Windows\System32\'
      - '\Windows\SysWOW64\'
      - '\Program Files\'
      - '\Program Files (x86)\'
  condition: selection_sc and selection_suspicious_binpath and not filter_legit
falsepositives:
  - Development or testing environments
  - Legitimate third-party services installed to non-standard locations
level: high
---
title: Service Installation via Windows Event Log
id: 3c6a9f4e-b2d0-5c8f-9e1b-4d5e6f7a8b9c
status: experimental
description: >
  Detects Windows service installation events (Event ID 4697 / 7045) where the
  service binary resides in a user-writable path.
references:
  - https://attack.mitre.org/techniques/T1543/003/
  - https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4697
author: B4B3-RAT Red Team
date: 2026/09/29
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID:
      - 4697   # Security log: A service was installed
      - 7045   # System log: A new service was installed
  filter_legit:
    ServiceFileName|contains:
      - '\Windows\System32\'
      - '\Windows\SysWOW64\'
      - '\Program Files\'
  condition: selection and not filter_legit
falsepositives:
  - Portable or development tools that install services to non-standard locations
level: high
