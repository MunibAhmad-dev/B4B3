title: Suspicious File Encryption with Custom Extension
id: 4e7b0c3f-d9a1-2d5e-6f8a-1b2c3d4e5f6a
status: experimental
description: >
  Detects mass file rename events appending a custom encryption extension
  (.b4db4b3 or similar non-standard extensions) — a strong indicator of ransomware
  or targeted file encryption performed by a RAT's FileCryptor module.
  Also covers rapid sequential rename activity characteristic of bulk encryption.
references:
  - https://attack.mitre.org/techniques/T1486/
author: B4B3-RAT Red Team
date: 2026/09/29
tags:
  - attack.impact
  - attack.t1486
logsource:
  product: windows
  category: file_rename
detection:
  selection_known_extension:
    TargetFilename|endswith:
      - '.b4db4b3'
      - '.locked'
      - '.encrypted'
      - '.enc'
      - '.crypted'
  condition: selection_known_extension
falsepositives:
  - Legitimate backup or archiving tools that append custom extensions
level: critical
---
title: High Volume File Renames in Short Time Window (Ransomware Indicator)
id: 5f8c1d4a-e0b2-3e6f-7a9b-2c3d4e5f6a7b
status: experimental
description: >
  A large number of file rename events within a short window from a single process
  suggests bulk encryption activity. Tune the threshold and time window for your
  environment's baseline.
references:
  - https://attack.mitre.org/techniques/T1486/
author: B4B3-RAT Red Team
date: 2026/09/29
tags:
  - attack.impact
  - attack.t1486
logsource:
  product: windows
  category: file_rename
detection:
  selection:
    TargetFilename|startswith:
      - 'C:\Users\'
  condition: selection | count(TargetFilename) by Image > 50
  timeframe: 30s
falsepositives:
  - Backup software
  - File synchronization tools
  - Bulk file converters
level: high
