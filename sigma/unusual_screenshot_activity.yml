title: Unusual Screenshot Activity via GDI or File Creation
id: 3d6a9b2e-c8f0-1c4d-5e7f-0a1b2c3d4e5f
status: experimental
description: >
  Detects screenshot capture activity observable as JPEG/PNG/BMP files written to
  Temp or AppData directories by non-imaging applications, or as GDI-based screen
  capture invoked from a process with no UI. RATs typically save screenshots to
  Temp before uploading them to the C2 server.
references:
  - https://attack.mitre.org/techniques/T1113/
author: B4B3-RAT Red Team
date: 2026/09/29
tags:
  - attack.collection
  - attack.t1113
logsource:
  product: windows
  category: file_event
detection:
  selection_screenshot_file:
    TargetFilename|contains:
      - '\Temp\'
      - '\AppData\Local\Temp\'
    TargetFilename|endswith:
      - '.jpeg'
      - '.jpg'
      - '.png'
      - '.bmp'
  filter_known_screenshot_tools:
    Image|endswith:
      - '\SnippingTool.exe'
      - '\ScreenSketch.exe'
      - '\mspaint.exe'
      - '\ShareX.exe'
      - '\Greenshot.exe'
  filter_browser_cache:
    Image|endswith:
      - '\chrome.exe'
      - '\firefox.exe'
      - '\msedge.exe'
  condition: selection_screenshot_file and not filter_known_screenshot_tools and not filter_browser_cache
falsepositives:
  - Applications that temporarily store image assets in Temp
  - Image editing / conversion tools
level: medium
