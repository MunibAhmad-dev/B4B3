title: Android Call Log and Contact Access
id: f8d6a7e9-3b40-8a79-c4f8-3d2e1f0a9b8c
status: experimental
description: |
    Detects an Android application reading call logs or contacts. Spyware harvests call
    history and contact lists to profile the victim, identify social graph, and exfiltrate
    to C2. READ_CALL_LOG requires a separate dangerous-permission grant since Android 9.
    Rule ACALL_001 covers call log; ACON_001 covers contacts (ATT&CK Mobile T1432).
references:
    - https://attack.mitre.org/techniques/T1432/
    - https://developer.android.com/reference/android/Manifest.permission#READ_CALL_LOG
    - https://developer.android.com/reference/android/Manifest.permission#READ_CONTACTS
author: B4DB4B3-RAT Detection Team
date: 2026-09-29
modified: 2026-09-29
tags:
    - attack.collection
    - attack.t1432
    - b4db4b3.rule.ACALL_001
    - b4db4b3.rule.ACON_001
logsource:
    product: b4db4b3_rat
    category: android_telemetry
detection:
    selection_calllog:
        platform: 'android'
        rule: 'ACALL_001'
    selection_contacts:
        platform: 'android'
        rule: 'ACON_001'
    condition: selection_calllog or selection_contacts
fields:
    - pkg
    - permission
    - rule
    - sev
    - tid
    - ts
falsepositives:
    - Default phone and contacts applications
    - CRM applications
    - Backup and sync applications with explicit user setup
level: high
