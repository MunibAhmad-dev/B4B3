title: Android Application Enumeration for Target Discovery
id: e7c5f6d8-2a3f-7f68-b3e7-2c1d0e9f8a7b
status: experimental
description: |
    Detects an Android application querying the package manager for a list of all
    installed applications. Malware uses this to identify target banking and payment apps
    for overlay attacks, or to determine what security products are installed
    (ATT&CK Mobile T1418 — Software Discovery). Also correlates with APK static
    analysis rule AAPK_001 which indicates a full app inventory report was submitted.
references:
    - https://attack.mitre.org/techniques/T1418/
    - https://developer.android.com/reference/android/content/pm/PackageManager#getInstalledApplications(int)
author: B4DB4B3-RAT Detection Team
date: 2026-09-29
modified: 2026-09-29
tags:
    - attack.discovery
    - attack.t1418
    - b4db4b3.rule.AAPP_001
    - b4db4b3.rule.AAPK_001
logsource:
    product: b4db4b3_rat
    category: android_telemetry
detection:
    selection_enum:
        platform: 'android'
        rule: 'AAPP_001'
    selection_apk:
        platform: 'android'
        rule: 'AAPK_001'
    condition: selection_enum or selection_apk
fields:
    - pkg
    - rule
    - sev
    - tid
    - ts
falsepositives:
    - App launchers that display installed apps
    - Backup applications
    - Battery and storage optimization apps
    - App store clients
level: medium
