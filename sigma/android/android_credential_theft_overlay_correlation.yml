title: Android Credential Theft via Overlay and Accessibility (Correlation)
id: e3c1f2d4-8a95-3f24-b9e3-8c7d6e5f4a3b
status: experimental
description: |
    Correlation rule: detects overlay attack (AOVL_001 — SYSTEM_ALERT_WINDOW) combined
    with accessibility service (AACC_001) and C2 communication (ANET_001/ANET_002) from
    the same package within 10 minutes. This triple is the complete credential theft kill
    chain: overlay fakes the login UI, accessibility intercepts keystrokes, C2 exfiltrates
    the credentials. Confidence: 90%. Maps to ACOR_005 in the B4DB4B3-RAT correlation engine.

    ATT&CK coverage: T1411 (Input Capture/Overlay) + T1437/T1521 (C2 Exfil)
references:
    - https://attack.mitre.org/techniques/T1411/
    - https://attack.mitre.org/techniques/T1437/
    - https://www.threatfabric.com/blogs/overlay-attacks-banking-trojans
author: B4DB4B3-RAT Detection Team
date: 2026-09-29
modified: 2026-09-29
tags:
    - attack.credential_access
    - attack.collection
    - attack.command_and_control
    - attack.t1411
    - attack.t1437
    - attack.t1521
    - b4db4b3.correlation.ACOR_005
logsource:
    product: b4db4b3_rat
    category: android_telemetry
detection:
    overlay:
        platform: 'android'
        rule: 'AOVL_001'
    accessibility:
        platform: 'android'
        rule: 'AACC_001'
    c2:
        platform: 'android'
        rule|contains:
            - 'ANET_001'
            - 'ANET_002'
    condition: overlay and accessibility and c2
timeframe: 10m
group-by:
    - pkg
fields:
    - pkg
    - target_pkg
    - ts
falsepositives:
    - None expected — this combination has no legitimate use case outside malware
level: critical
# Confidence: 90% — no legitimate app needs overlay + accessibility + C2 simultaneously
# Immediate response: revoke device admin if AADM_001 also present, factory reset recommended
